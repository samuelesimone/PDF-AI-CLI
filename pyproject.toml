[project]
name = "pdf-ai"
version = "0.1.0"
description = "Local PDF RAG chat with a local LLM — terminal MVP"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "llama-index>=0.10.0",
    "llama-index-llms-ollama>=0.3.0",
    "llama-index-embeddings-ollama>=0.3.0",
    "docling>=2.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
pdf-ai = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
